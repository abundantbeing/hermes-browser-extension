<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="ui.hermes.voice.dictation">Hermes Voice Dictation</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <link rel="stylesheet" href="sidepanel-themes.css" />
    <link rel="stylesheet" href="lib/voice-wingbeat.css" />
    <link rel="stylesheet" href="lib/fonts.css" />
    <link rel="stylesheet" href="lib/surface-text-zoom.css" />
    <style>
      /* The voice tab is a slice of the side panel: its hero card, the dictation
         strip, a composer-style box the glow rises from, and one primary action.
         Everything else is the panel's own CSS. */
      body.voice-page {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        overflow: auto;
      }
      .voice-shell {
        width: min(420px, 100%);
        display: grid;
        gap: 8px;
      }
      .voice-hero { min-height: 128px; }
      .voice-hero .hero-dismiss { color: var(--hermes-fg); }
      .voice-composer { border: 1px solid var(--hermes-line); }
      .voice-stage {
        position: relative;
        min-height: 128px;
        padding: 12px 14px 40px;
        border: 1px solid var(--hermes-line-strong);
        background: var(--hermes-input-bg, var(--hermes-paper));
        color: var(--hermes-ink);
      }
      .voice-status-title,
      .voice-status {
        position: relative;
        z-index: 2; /* text stays crisp above the glow */
        margin: 0;
      }
      .voice-status-title {
        margin-bottom: 6px;
        font-family: var(--hermes-font-ui);
        font-size: calc(10px * var(--hermes-text-zoom, 1));
        font-weight: 700;
        letter-spacing: 0.15em;
        line-height: 1.35;
        text-transform: uppercase;
      }
      .voice-status {
        font-size: calc(13px * var(--hermes-text-zoom, 1));
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .voice-actions { flex-wrap: wrap; }
      .voice-actions #startVoiceButton {
        margin-left: auto;
        background: var(--hermes-primary-bg);
        color: var(--hermes-primary-fg);
        border-color: var(--hermes-primary-border);
      }
      .voice-actions #startVoiceButton:hover,
      .voice-actions #startVoiceButton:focus-visible {
        background: var(--hermes-primary-fg, var(--hermes-paper));
        color: var(--hermes-primary-bg, var(--hermes-ink));
        border-color: var(--hermes-primary-bg, var(--hermes-ink));
      }
    </style>
  </head>
  <body class="voice-page">
    <main class="voice-shell" aria-labelledby="voiceTitle">
      <section class="hero-card voice-hero">
        <button id="closeVoiceButton" class="hero-dismiss" type="button" aria-label="Close" title="Close" data-i18n-aria-label="ui.close" data-i18n-title="ui.close">
          <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="hero-copy">
          <h1 id="voiceTitle" class="eyebrow" data-i18n="ui.voice.dictation">Voice dictation</h1>
          <svg class="hero-wordmark" viewBox="0 0 2918.77 1206.98" role="img" aria-label="Hermes Browser" data-i18n-aria-label="ui.hermes.browser">
            <use href="assets/img/hermes-browser-logo-left.svg#Layer_1"></use>
          </svg>
        </div>
        <img class="hero-badge" src="assets/img/hermes-badge.webp" alt="Hermes Agent badge" data-i18n-alt="ui.hermes.agent.badge" />
      </section>
      <section class="composer voice-composer">
        <div id="voiceActivity" class="voice-activity" hidden aria-hidden="true">
          <span class="voice-activity-dot"></span>
          <strong id="voiceActivityLabel"></strong>
          <span id="voiceActivityTimer" class="voice-activity-timer">0:00</span>
        </div>
        <div id="voiceGlow" class="voice-stage">
          <p id="voiceStatusTitle" class="voice-status-title" hidden></p>
          <div id="voiceStatus" class="voice-status" role="status" aria-live="polite" data-i18n="ui.click.start.dictation.to.grant.microphone.access.and.record">Click Start dictation to grant microphone access and record.</div>
        </div>
        <div class="composer-actions voice-actions">
          <button id="openMicSettingsButton" class="secondary" type="button" data-i18n="ui.open.microphone.settings">Open microphone settings</button>
          <button id="startVoiceButton" type="button" data-i18n="ui.start.dictation">Start dictation</button>
        </div>
      </section>
    </main>
    <script type="module" src="voice-dictation.js"></script>
  </body>
</html>
