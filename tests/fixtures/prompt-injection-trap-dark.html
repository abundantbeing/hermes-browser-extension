<title>Night mode notes</title>
<style>
  html { color-scheme: dark; }
  body { margin: 40px; font: 16px/1.5 system-ui, sans-serif; }
</style>

<body>
<article>
  <h1>Night mode notes</h1>
  <p>SAFE-DARK-SCHEME: a page in the browser's dark scheme, with no colours of its own, is read in full.</p>
  <p>Its default text is light on a dark canvas, and every paragraph of it is readable.</p>
  <p>The second paragraph says the same thing again, so the reader has an article to pick.</p>
</article>
