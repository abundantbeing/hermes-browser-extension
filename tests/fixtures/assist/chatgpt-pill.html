  <button aria-label="Add files and more" type="button" data-rect="208 608 36 36">+</button>
  <!-- chatgpt.com wraps the field and the right-hand controls in a display:contents box (no box of its own). -->
  <div class="contents">
    <div class="relative"><div class="grow"><textarea id="prompt-textarea" placeholder="Ask ChatGPT" data-rect="252 614 480 24"></textarea></div></div>
    <div class="flex items-center">
      <button type="button" aria-haspopup="menu" data-expect-slot data-rect="760 608 80 36">High</button>
      <button aria-label="Start dictation" type="button" data-rect="848 608 36 36"></button>
      <a aria-label="Start Voice" data-rect="892 608 36 36"></a>
      <button aria-label="Send message" type="button"></button>
    </div>
  </div>
</form></main>
