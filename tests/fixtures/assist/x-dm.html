<!-- An X direct message (x.com/i/chat, 2026-11): + on the left outside the box, then the pill with the Message field and the voice button at its right end. -->
<main role="main">
  <div class="dm-composer" data-rect="0 600 400 56">
    <button aria-label="Add attachment" type="button" data-rect="8 608 40 40">+</button>
    <div class="pill" data-rect="56 606 336 44">
      <textarea placeholder="Message" aria-label="Message" data-rect="72 616 236 24"></textarea>
      <button aria-label="Record voice message" type="button" data-expect-slot data-rect="344 612 32 32"></button>
    </div>
  </div>
</main>
