<!-- YouTube comment box: avatar, contenteditable, emoji button on the left, Cancel and Comment on the right. -->
<ytd-commentbox data-rect="24 400 900 110">
  <div id="author-thumbnail" data-rect="24 400 40 40"></div>
  <div id="contenteditable-root" contenteditable="true" aria-label="Add a comment…" data-rect="80 408 844 24"></div>
  <div id="footer" data-rect="80 448 844 40">
    <yt-icon-button id="emoji-button" data-expect-slot data-rect="80 456 24 24"></yt-icon-button>
    <ytd-button-renderer id="cancel-button" data-rect="740 452 80 36"></ytd-button-renderer>
    <ytd-button-renderer id="submit-button" data-rect="830 452 94 36"></ytd-button-renderer>
  </div>
</ytd-commentbox>
