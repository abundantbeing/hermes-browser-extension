<!-- Any other site: a chat box whose buttons sit just past the message field's right edge, with no room between them for the circle. -->
<main>
  <div class="chat" data-rect="80 690 620 68">
    <div class="pill" data-rect="90 696 600 56">
      <textarea rows="2" placeholder="Write a message" data-rect="100 700 500 48"></textarea>
      <button aria-label="Attach a file" type="button" data-rect="608 712 24 24"><svg data-rect="612 716 16 16"></svg></button>
      <button aria-label="Send" type="button" data-rect="640 712 24 24"><svg data-rect="644 716 16 16"></svg></button>
    </div>
  </div>
</main>
