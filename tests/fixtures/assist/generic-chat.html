<!-- Any other site: a one-line chat box, a pill with the message field and its attach and send buttons at the right end, beside the text. -->
<main>
  <div class="chat" data-rect="300 700 600 60">
    <div class="pill" data-rect="300 708 600 44">
      <textarea rows="1" placeholder="Write a message" data-rect="320 718 440 24"></textarea>
      <button aria-label="Attach a file" type="button" data-expect-slot data-rect="800 714 32 32"><svg data-rect="808 722 16 16"></svg></button>
      <button aria-label="Send" type="button" data-rect="842 714 48 32">Send</button>
    </div>
  </div>
</main>
