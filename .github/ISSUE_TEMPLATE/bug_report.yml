name: 🐛 Bug Report
description: Report a bug, broken feature, or unexpected behavior in Hermes Browser Extension
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: Extension Version
      description: What version of Hermes Browser Extension are you running? (e.g. 0.3.0)
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser & OS
      description: Which browser and operating system are you using?
      options:
        - "Comet (Chromium) on Windows 11"
        - "Chrome / Chromium on Windows"
        - "Chrome / Chromium on macOS"
        - "Chrome / Chromium on Linux"
        - "Brave"
        - "Edge"
        - "Firefox (Developer / Nightly)"
        - "Other (specify below)"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected Surface
      description: Where did the bug occur?
      options:
        - "Side Panel (chat / model picker / commands)"
        - "Hermes Assist (inline floating widget on web pages)"
        - "Hermes Web (full tab workspace)"
        - "Browser Control / Agent Actions"
        - "Context Capture / Page Context"
        - "Theme Studio / Appearance"
        - "Connection / Gateway Pairing"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Problem
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open Side Panel on page '...'
        2. Select model '...'
        3. Send prompt '...'
        4. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Gateway Error
      description: Paste any error messages from the browser console (`F12` or Extension Service Worker inspection) or gateway log.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Media
      description: Drag and drop screenshots showing the error state.
