name: Scope check

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scope-check:
    runs-on: ubuntu-latest
    concurrency:
      group: scope-check-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # Do not skip PRs from the repo owner: vendor-scope docs should be flagged the same as any other contributor.
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            // Keyword patterns — edit this list
            const keywordPatterns = [
              /\bMCP\b/i,
              /search provider/i,
              /opt-in .* configuration/i,
            ];

            // Guide basenames that look like vendor/MCP setup docs — edit this pattern
            const vendorGuideBasenamePattern = /mcp|search-provider|-search/i;

            const isVendorSetupPath = (filename) => {
              if (filename.startsWith('examples/')) return true;
              if (filename.startsWith('guides/')) {
                const basename = filename.slice('guides/'.length);
                return vendorGuideBasenamePattern.test(basename);
              }
              return false;
            };

            const { owner, repo, number } = context.issue;
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull_request in payload; nothing to do.');
              return;
            }

            const title = typeof pr.title === 'string' ? pr.title : '';
            const body = typeof pr.body === 'string' ? pr.body : '';
            const combinedText = `${title}\n${body}`;

            const keywordMatch = keywordPatterns.some((pattern) => pattern.test(combinedText));

            const files = [];
            for (let page = 1; ; page += 1) {
              const response = await github.rest.pulls.listFiles({
                owner,
                repo,
                pull_number: number,
                per_page: 100,
                page,
              });
              files.push(...response.data);
              if (response.data.length < 100) break;
            }

            const onlyVendorSetupPaths =
              files.length > 0 && files.every((file) => isVendorSetupPath(file.filename));

            if (!keywordMatch && !onlyVendorSetupPaths) {
              core.info('PR is in scope; no action.');
              return;
            }

            const label = 'out-of-scope';
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: number,
                labels: [label],
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: 'ededed',
                  description: 'Changes belong in Hermes or vendor docs, not this repo',
                });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: number,
                  labels: [label],
                });
              } else {
                throw error;
              }
            }

            const marker = '<!-- scope-check -->';
            const commentBody = `${marker}\nThanks for the PR! A quick heads-up: this repo covers the browser extension itself, so docs or configs for third-party tools, search providers or MCP servers usually belong in the Hermes docs or the vendor's docs. See the Scope section in CONTRIBUTING.md. A maintainer will take a look.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' && (comment.body || '').includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: commentBody,
              });
            }
