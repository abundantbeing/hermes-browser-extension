name: hermes-browser-companion
kind: standalone
version: 0.4.0
manifest_version: 2
api_version: 1
description: >-
  Hermes Browser companion plugin — caches browser context from conversations
  and exposes it to the agent via tools and lifecycle hooks, and carries Hermes
  Control, the agent driving the person's own browser through the extension.
  Fail-soft: when no browser context or browser is available, all tools
  gracefully report unavailable.
author: Iruzen (iruzen-dono)
license: MIT
homepage: https://github.com/abundantbeing/hermes-browser-extension
tags: [browser, context]
# Tested on the 0.22 runtime; a SemVer floor, never newer than a shipped release.
requires_hermes: ">=0.22"

# No privileged host surface is requested: the plugin registers its own
# `browser_*` tools (it overrides no built-in tool), makes no host-owned LLM
# call, acts on no chat platform and reads no credential. Declaring nothing
# is the truthful `capabilities:` block, so the consent screen stays empty.
capabilities: []

provides_tools:
  - browser_context_status
  - browser_get_context
  - browser_clear_context
  - browser_event_log
  - browser_control_status
  - browser_context_journal
  - browser_text_utility
  - browser_back
  - browser_batch
  - browser_click
  - browser_drag
  - browser_fill
  - browser_hover
  - browser_navigate
  - browser_press
  - browser_screenshot
  - browser_scroll
  - browser_scroll_to
  - browser_select
  - browser_snapshot
  - browser_tab_activate
  - browser_tab_close
  - browser_tab_create
  - browser_tab_group
  - browser_tab_ungroup
  - browser_tabs
  - browser_type

config_schema:
  durable_receipts:
    type: bool
    default: true
    description: Persist only bounded redacted tool receipt metadata across restarts.
  receipt_limit:
    type: int
    default: 8
    description: Maximum durable redacted receipts to retain, clamped to eight.

provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
